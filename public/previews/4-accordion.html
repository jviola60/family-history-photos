<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Preview 4 – Smart Accordion</title>
<link rel="stylesheet" href="common.css">
<style>
body{background:#dfe9dc;color:#24352a;min-height:100vh;padding:34px 16px 90px}
.wrap{max-width:1150px;margin:0 auto;background:#fff;border-radius:22px;overflow:hidden;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);box-shadow:0 12px 40px #2f4a3a33}
.l{background:#f6f2e6;padding:20px;position:relative;display:flex;flex-direction:column;gap:12px}
.l img{width:100%;border-radius:14px;transition:transform .3s;transform-origin:center}
.zoom{position:absolute;top:30px;right:30px;display:flex;gap:4px;background:#fffd;border-radius:12px;padding:4px}.zoom button{padding:8px 10px;border-radius:8px}.zoom button:hover{background:#dfe9dc}
.film{display:flex;gap:8px;overflow:auto}.film img{width:70px;height:54px;object-fit:cover;border-radius:8px;opacity:.6;cursor:pointer}.film img:first-child{opacity:1;outline:3px solid #6f9a7b}
.r{padding:22px}
.head{display:flex;align-items:center;gap:18px;margin-bottom:16px}
.ring{--p:0;width:92px;height:92px;border-radius:50%;background:conic-gradient(#6f9a7b calc(var(--p)*1%),#dfe9dc 0);display:grid;place-items:center;flex:none}
.ring div{width:72px;height:72px;border-radius:50%;background:#fff;display:grid;place-items:center;text-align:center;font-size:11px;line-height:1.2}.ring b{font-size:20px;display:block}
.head small{letter-spacing:.08em;color:#6f8a77}.head h1{font-size:22px}
.sec{border:1px solid #cfdccf;border-radius:14px;margin-bottom:10px;overflow:hidden}
.sh{display:flex;align-items:center;gap:12px;width:100%;padding:14px 16px;text-align:left}
.ck{width:24px;height:24px;border-radius:50%;background:#cfdccf;color:#fff;display:grid;place-items:center;font-size:14px;flex:none}.ck.ok{background:#6f9a7b}
.sh b{display:block}.sh span{font-size:13px;color:#6f8a77;display:block;max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sb{display:none;padding:4px 16px 16px}.sec.open .sb{display:block}.sec.open{border-color:#6f9a7b}.sec.open .sh{background:#e6efe4}
label{display:block;font-weight:600;font-size:13px;margin:10px 0 4px}
input,select,textarea{padding:11px;border:1px solid #bccfbf;border-radius:10px}
.chip{display:inline-flex;align-items:center;background:#e3eee3;padding:8px 14px;border-radius:999px;margin:0 8px 8px 0;font-weight:600}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}.btns button{padding:12px;border-radius:10px;background:#eef4ec;text-align:left;font-weight:600}.btns button:hover{background:#dbe8d9}
.save{display:block;margin:14px 0 0 auto;background:#6f9a7b;color:#fff;font-weight:700;padding:14px 28px;border-radius:12px}
@media(max-width:760px){.wrap{grid-template-columns:1fr}.two,.btns{grid-template-columns:1fr}.sh span{max-width:200px}}
</style></head><body>
<div class="wrap">
 <div class="l"><img id="img" alt="Photo"><div class="zoom"><button onclick="z(-.25)">−</button><button onclick="z(0)">Fit</button><button onclick="z(.25)">+</button></div><div class="film" id="film"></div></div>
 <div class="r"><div class="head"><div class="ring" id="ring"><div><span><b id="cnt">0</b>of 6</span></div></div><div><small>PHOTO 1 OF 15</small><h1 id="title"></h1></div></div><div id="secs"></div><button class="save" data-act="Save & Next Photo">Save &amp; Next Photo →</button></div>
</div>
<script src="common.js"></script>
<script>
const D=FH.data;img.src=FH.photo;let scale=1,open='people';
function z(d){scale=d==0?1:Math.max(.75,Math.min(2,scale+d));img.style.transform=`scale(${scale})`}
film.innerHTML=Array(8).fill(`<img src="${FH.photo}">`).join('');
const checks=()=>[D.people.length>0,!!D.date,!!D.place,!!D.branch,!!D.story,!!D.decade];
function sum(k){return{people:D.people.map(p=>p.name).join(', ')||'Tag family members in this photo',date:[D.date,D.place].filter(Boolean).join(' · ')||'Add where and when it happened',story:D.story||'Describe the event',tools:'Fix quality, crop, faces, red eyes…',share:'Copy or download for FamilySearch'}[k]}
function body(k){
 if(k=='people')return D.people.map((p,i)=>`<span class="chip">${FH.esc(p.name)} (${p.rel})<button class="chip-x" onclick="D.people.splice(${i},1);draw()">✕</button></span>`).join('')+`<div class="two"><input id="nm" placeholder="Type a name"><button class="btns" style="display:block" onclick="add()"><b style="display:block;padding:11px;background:#eef4ec;border-radius:10px">+ Add person</b></button></div>`;
 if(k=='date')return `<div class="two"><div><label>Exact date</label><input value="${D.date}" oninput="D.date=this.value;ring_()"></div><div><label>Decade</label><select onchange="D.decade=this.value;ring_()">${FH.opts(FH.decades,D.decade)}</select></div></div><label>Place or occasion</label><input value="${D.place}" oninput="D.place=this.value;ring_()"><div class="two"><div><label>Family branch</label><input value="${D.branch}" oninput="D.branch=this.value;ring_()"></div><div><label>Photo group</label><select>${FH.opts(FH.groups,D.group)}</select></div></div>`;
 if(k=='story')return `<textarea rows="6" oninput="D.story=this.value;ring_()">${D.story}</textarea>`;
 if(k=='tools')return `<div class="btns">${FH.tools.map(t=>`<button data-act="${t[1]}">${t[0]} ${t[1]}</button>`).join('')}</div>`;
 return `<div class="btns">${FH.share.map(t=>`<button data-act="${t[1]}">${t[0]} ${t[1]}</button>`).join('')}</div>`;
}
const defs=[['people','People'],['date','Date & Place'],['story','Story & Memories'],['tools','Photo Tools'],['share','Share to FamilySearch']];
function add(){const v=nm.value.trim();if(v){D.people.push({name:v,rel:'Friend'});draw()}}
function ring_(){const c=checks().filter(Boolean).length;cnt.textContent=c;ring.style.setProperty('--p',c/6*100);title.textContent=D.people[0]?D.people[0].name+' – '+D.place:'Untitled photo';
 ['people','date','story'].forEach(k=>{const e=document.getElementById('ck-'+k);if(e){const ok=k=='people'?D.people.length:k=='date'?D.date&&D.place:D.story;e.classList.toggle('ok',!!ok);e.textContent=ok?'✓':''}})}
function draw(){
 secs.innerHTML=defs.map(([k,n])=>`<div class="sec ${open==k?'open':''}"><button class="sh" onclick="open_('${k}')"><span class="ck ${['people','date','story'].includes(k)?'':'ok'}" id="ck-${k}"></span><div><b>${n}</b><span>${FH.esc(sum(k))}</span></div></button><div class="sb">${body(k)}</div></div>`).join('');ring_();
}
function open_(k){open=open==k?'':k;draw()}
draw();
</script></body></html>
